[package]
name = "wow-tux-forge"
version = "0.1.3"
edition = "2024"
license = "GPL-3.0"

[dependencies]
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
